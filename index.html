<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mobile Video Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class="video-container">
        <video id="player" playsinline controls preload="metadata">
            <source src="https://github.com/user-attachments/assets/e9f0092a-5902-4854-82f8-1e467f4338f3" type="video/mp4">
            Browser kamu tidak mendukung pemutar video ini.
        </video>

        <div id="playBtn" class="play-overlay">
            <div class="play-icon">▶</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
