<!DOCTYPE html>
<html lang="id">
<head>
  <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Stream Interface</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="phone-container">
        
        <div class="video-background">
            <video autoplay muted loop playsinline>
                <source src="https://github.com/user-attachments/assets/4a6c8937-fdea-4ee0-94c7-49b9ad2f71c5" type="video/mp4">
            </video>
            <div class="center-play-btn">▶</div>
        </div>

        <div class="overlay-content">
            
            <header class="live-header">
                <div class="left-header">
                    <span class="badge-live">● LIVE</span>
                    <span class="streamer-name">💋 Midnig...</span>
                </div>
                <div class="right-header">
                    <div class="viewer-count">
                        <span class="eye-icon">👁️</span> 2.7K <span class="text-light">menonton</span>
                    </div>
                </div>
            </header>

            <div class="likes-counter">
                ❤️ 9.8K
            </div>

            <div class="right-actions">
                <div class="action-item">
                    <div class="action-icon">🖤</div>
                    <span>Suka</span>
                </div>
                <div class="action-item">
                    <div class="action-icon">💬</div>
                </div>
            </div>

            <div class="popup-notification">
                <div class="popup-header">
                    <span class="popup-title">Wild Bandito x1000</span>
                    <span class="popup-time">now</span>
                </div>
                <p class="popup-body">Jackpot will x 1000 ! Langsung WD !</p>
                <div class="popup-buttons">
                    <button class="btn-like">❤️ LIKE</button>
                    <button class="btn-reply">💬 REPLY</button>
                </div>
                
                <div class="location-badge">
                    📍 Surabaya
                </div>
            </div>

            <footer class="bottom-bar">
                <div class="comment-input-container">
                    <span class="emoji-icon">😊</span>
                    <input type="text" placeholder="Ketik komentar...">
                    <button class="btn-send">Kirim</button>
                </div>
            </footer>

        </div>
    </div>

</body>
</html>
